name: FBM Report KST
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet pandas openpyxl requests python-amazon-sp-api
      - name: Overwrite report.py
        run: |
          cat > report.py << 'PY'
          import os, requests, time
          from datetime import datetime, timedelta, timezone
          import pandas as pd
          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          LWA_CLIENT_ID = os.getenv("LWA_CLIENT_ID")
          LWA_CLIENT_SECRET = os.getenv("LWA_CLIENT_SECRET")
          REFRESH_TOKEN_JP = os.getenv("REFRESH_TOKEN_JP")
          REFRESH_TOKEN_NA = os.getenv("REFRESH_TOKEN_NA")
          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

          def get_lwa_token(refresh):
              r = requests.post("https://api.amazon.com/auth/o2/token", data={
                  "grant_type":"refresh_token","refresh_token":refresh,
                  "client_id":LWA_CLIENT_ID,"client_secret":LWA_CLIENT_SECRET
              }, timeout=15)
              r.raise_for_status()
              return r.json()["access_token"]

          def get_rdt_and_address(lwa_token, order_id, region):
              base_url = f"https://sellingpartnerapi-{region}.amazon.com"
              headers = {"x-amz-access-token": lwa_token, "Content-Type":"application/json"}
              # ⭐ 핵심: dataElements 넣어야 전체 주소/이메일 나옴!
              body = {
                  "restrictedResources": [
                      {"method":"GET","path":f"/orders/v0/orders/{order_id}/address","dataElements":["shippingAddress"]},
                      {"method":"GET","path":f"/orders/v0/orders/{order_id}/buyerInfo","dataElements":["buyerInfo"]},
                      {"method":"GET","path":f"/orders/v0/orders/{order_id}","dataElements":["buyerInfo","shippingAddress"]}
                  ]
              }
              try:
                  rdt_res = requests.post(f"{base_url}/tokens/2021-03-01/restrictedDataToken", headers=headers, json=body, timeout=15)
                  if rdt_res.status_code!= 200:
                      print(f"RDT 실패 {order_id}: {rdt_res.text[:500]}")
                      return {}, ""
                  rdt = rdt_res.json().get("restrictedDataToken","")
                  rdt_h = {"x-amz-access-token": rdt}
                  addr_res = requests.get(f"{base_url}/orders/v0/orders/{order_id}/address", headers=rdt_h, timeout=15)
                  buyer_res = requests.get(f"{base_url}/orders/v0/orders/{order_id}/buyerInfo", headers=rdt_h, timeout=15)
                  addr = addr_res.json().get("payload",{}).get("ShippingAddress",{}) if addr_res.status_code==200 else {}
                  buyer = buyer_res.json().get("payload",{}) if buyer_res.status_code==200 else {}
                  # 로그
                  print(f"{order_id} => 이름:{addr.get('Name')} 주소1:{addr.get('AddressLine1')} 이메일:{buyer.get('BuyerEmail')}")
                  return addr, buyer.get("BuyerEmail","")
              except Exception as e:
                  print(f"에러 {order_id}: {e}")
                  return {}, ""

          def fetch_fbm_orders():
              from sp_api.api import Orders
              from sp_api.base import Marketplaces
              jp_orders, na_orders = [], []
              last_updated_after = (datetime.utcnow() - timedelta(days=7)).isoformat() + "Z"
              for mp, refresh, is_jp, region in [
                  (Marketplaces.JP, REFRESH_TOKEN_JP, True, "fe"),
                  (Marketplaces.US, REFRESH_TOKEN_NA, False, "na"),
                  (Marketplaces.CA, REFRESH_TOKEN_NA, False, "na"),
                  (Marketplaces.MX, REFRESH_TOKEN_NA, False, "na")]:
                  if not refresh: continue
                  try:
                      lwa_token = get_lwa_token(refresh)
                      creds = dict(lwa_app_id=LWA_CLIENT_ID, lwa_client_secret=LWA_CLIENT_SECRET, refresh_token=refresh)
                      api = Orders(credentials=creds, marketplace=mp)
                      res = api.get_orders(LastUpdatedAfter=last_updated_after, OrderStatuses=["Unshipped", "PartiallyShipped"], FulfillmentChannels=["MFN"])
                      orders = res.payload.get("Orders", []) if res.payload else []
                      while res.payload and res.payload.get("NextToken"):
                          res = api.get_orders(NextToken=res.payload["NextToken"])
                          orders.extend(res.payload.get("Orders", []) if res.payload else [])
                      for o in orders:
                          try: o["Items"] = api.get_order_items(o["AmazonOrderId"]).payload.get("OrderItems", [])
                          except: o["Items"] = []
                          addr, email = get_rdt_and_address(lwa_token, o["AmazonOrderId"], region)
                          o["FullAddress"] = addr
                          o["BuyerEmail"] = email
                          o["Marketplace"] = mp.name
                          time.sleep(0.8)
                      (jp_orders if is_jp else na_orders).extend(orders)
                      print(f"{mp.name}: {len(orders)}건")
                  except Exception as e:
                      print(f"{mp.name} 에러: {e}")
              return jp_orders, na_orders

          def make_file(orders, prefix):
              rows = []
              for o in orders:
                  try: kst_str = pd.to_datetime(o.get("PurchaseDate","")).tz_convert("Asia/Seoul").strftime("%Y-%m-%d %H:%M")
                  except: kst_str = str(o.get("PurchaseDate",""))
                  addr = o.get("FullAddress", {}) or {}
                  order_total = o.get("OrderTotal", {}) or {}
                  email = o.get("BuyerEmail","")
                  for item in o.get("Items", []) or [{"SellerSKU":"-","QuantityOrdered":0}]:
                      ip = item.get("ItemPrice", {}) if isinstance(item, dict) else {}
                      rows.append({
                          "주문번호": o.get("AmazonOrderId",""),
                          "주문시간(KST)": kst_str,
                          "마켓": o.get("Marketplace",""),
                          "수령인": addr.get("Name",""),
                          "이메일": email,
                          "전화번호": addr.get("Phone",""),
                          "주소1": addr.get("AddressLine1",""),
                          "주소2": addr.get("AddressLine2",""),
                          "도시": addr.get("City",""),
                          "주/도": addr.get("StateOrRegion",""),
                          "우편번호": addr.get("PostalCode",""),
                          "국가": addr.get("CountryCode",""),
                          "SKU": item.get("SellerSKU",""),
                          "수량": item.get("QuantityOrdered",""),
                          "상품판매가": ip.get("Amount","") if isinstance(ip, dict) else "",
                          "통화": ip.get("CurrencyCode","") or order_total.get("CurrencyCode",""),
                          "주문총액": order_total.get("Amount",""),
                      })
              df = pd.DataFrame(rows) if rows else pd.DataFrame([{"주문번호": f"{prefix} 미배송 없음 ✅"}])
              filename = f"FBM_{prefix}_Unshipped_{now_kst.strftime('%m%d_%H%M')}.xlsx"
              df.to_excel(filename, index=False)
              return filename, df

          def send_telegram(jp_file, jp_df, na_file, na_df):
              import requests as req
              bot, chat = TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
              def cnt(df): return 0 if "미배송 없음" in df['주문번호'].iloc[0] else df['주문번호'].nunique()
              req.post(f"https://api.telegram.org/bot{bot}/sendMessage", json={"chat_id": chat, "text": f"📦 FBM 최종 (주소/이메일 포함) {now_kst.strftime('%m/%d %H시')}\nJP:{cnt(jp_df)}건 NA:{cnt(na_df)}건"}, timeout=15)
              for f in [jp_file, na_file]:
                  with open(f,'rb') as fd:
                      req.post(f"https://api.telegram.org/bot{bot}/sendDocument", data={"chat_id": chat}, files={"document": fd}, timeout=30)

          if __name__ == "__main__":
              jp_orders, na_orders = fetch_fbm_orders()
              jp_file, jp_df = make_file(jp_orders, "JP")
              na_file, na_df = make_file(na_orders, "NA")
              send_telegram(jp_file, jp_df, na_file, na_df)
          PY
      - name: Run FBM Report
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          REFRESH_TOKEN_JP: ${{ secrets.REFRESH_TOKEN_JP }}
          REFRESH_TOKEN_NA: ${{ secrets.REFRESH_TOKEN_NA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report.py
