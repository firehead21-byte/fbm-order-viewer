name: FBM Report KST
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet pandas openpyxl requests python-amazon-sp-api
      - name: Overwrite report.py with fixed version
        run: |
          cat > report.py << 'PY'
          import os, requests
          from datetime import datetime, timedelta, timezone
          import pandas as pd
          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          print(f"리포트 실행: {now_kst} - JP/NA 2개 파일")
          LWA_CLIENT_ID = os.getenv("LWA_CLIENT_ID")
          LWA_CLIENT_SECRET = os.getenv("LWA_CLIENT_SECRET")
          REFRESH_TOKEN_JP = os.getenv("REFRESH_TOKEN_JP")
          REFRESH_TOKEN_NA = os.getenv("REFRESH_TOKEN_NA")
          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
          def fetch_fbm_orders():
              from sp_api.api import Orders
              from sp_api.base import Marketplaces
              jp_orders, na_orders = [], []
              last_updated_after = (datetime.utcnow() - timedelta(days=7)).isoformat() + "Z"
              for mp, refresh, is_jp in [(Marketplaces.JP, REFRESH_TOKEN_JP, True), (Marketplaces.US, REFRESH_TOKEN_NA, False), (Marketplaces.CA, REFRESH_TOKEN_NA, False), (Marketplaces.MX, REFRESH_TOKEN_NA, False)]:
                  if not refresh: continue
                  try:
                      creds = dict(lwa_app_id=LWA_CLIENT_ID, lwa_client_secret=LWA_CLIENT_SECRET, refresh_token=refresh)
                      api = Orders(credentials=creds, marketplace=mp)
                      res = api.get_orders(LastUpdatedAfter=last_updated_after, OrderStatuses=["Unshipped", "PartiallyShipped"], FulfillmentChannels=["MFN"])
                      orders = res.payload.get("Orders", []) if res.payload else []
                      while res.payload and res.payload.get("NextToken"):
                          res = api.get_orders(NextToken=res.payload["NextToken"])
                          orders.extend(res.payload.get("Orders", []) if res.payload else [])
                      for o in orders:
                          try: o["Items"] = api.get_order_items(o["AmazonOrderId"]).payload.get("OrderItems", [])
                          except: o["Items"] = []
                          o["Marketplace"] = mp.name
                      if is_jp:
                          jp_orders.extend(orders)
                      else:
                          na_orders.extend(orders)
                      print(f"{mp.name}: 미배송 {len(orders)}건")
                  except Exception as e:
                      print(f"{mp.name} 에러: {e}")
              return jp_orders, na_orders
          def make_file(orders, prefix):
              rows = []
              for o in orders:
                  purchase = o.get("PurchaseDate", "")
                  kst_str = ""
                  if purchase:
                      try: kst_str = pd.to_datetime(purchase).tz_convert("Asia/Seoul").strftime("%Y-%m-%d %H:%M")
                      except: kst_str = str(purchase)
                  if not o.get("Items"):
                      rows.append({"주문번호": o.get("AmazonOrderId",""), "주문시간(KST)": kst_str, "마켓": o.get("Marketplace",""), "상태": o.get("OrderStatus",""), "SKU": "-", "수량": 0})
                  else:
                      for item in o.get("Items", []):
                          rows.append({"주문번호": o.get("AmazonOrderId",""), "주문시간(KST)": kst_str, "마켓": o.get("Marketplace",""), "상태": o.get("OrderStatus",""), "SKU": item.get("SellerSKU",""), "수량": item.get("QuantityOrdered","")})
              if not rows:
                  df = pd.DataFrame([{"주문번호": f"{prefix} 미배송 없음 ✅", "주문시간(KST)": now_kst.strftime("%Y-%m-%d %H:%M")}])
              else:
                  df = pd.DataFrame(rows)
              filename = f"FBM_{prefix}_Unshipped_{now_kst.strftime('%m%d_%H%M')}.xlsx"
              df.to_excel(filename, index=False)
              print(f"엑셀 생성: {filename} {len(df)}행")
              return filename, df
          def send_telegram(jp_file, jp_df, na_file, na_df):
              try:
                  bot = TELEGRAM_BOT_TOKEN
                  chat = TELEGRAM_CHAT_ID
                  jp_cnt = 0 if "미배송 없음" in jp_df['주문번호'].iloc[0] else jp_df['주문번호'].nunique()
                  na_cnt = 0 if "미배송 없음" in na_df['주문번호'].iloc[0] else na_df['주문번호'].nunique()
                  text = f"📦 FBM 미배송 리포트 {now_kst.strftime('%m/%d %H시 KST')}\nJP: {jp_cnt}건 / NA: {na_cnt}건 / 총 {jp_cnt+na_cnt}건"
                  requests.post(f"https://api.telegram.org/bot{bot}/sendMessage", json={"chat_id": chat, "text": text}, timeout=15)
                  # JP 파일 전송
                  with open(jp_file, 'rb') as f:
                      r = requests.post(f"https://api.telegram.org/bot{bot}/sendDocument", data={"chat_id": chat, "caption": f"🇯🇵 일본 미배송 {jp_cnt}건"}, files={"document": f}, timeout=30)
                      print(f"JP 파일 전송: {r.status_code}")
                  # NA 파일 전송
                  with open(na_file, 'rb') as f:
                      r = requests.post(f"https://api.telegram.org/bot{bot}/sendDocument", data={"chat_id": chat, "caption": f"🇺🇸 북미 미배송 {na_cnt}건"}, files={"document": f}, timeout=30)
                      print(f"NA 파일 전송: {r.status_code}")
              except Exception as e:
                  print(f"텔레그램 실패: {e}")
          if __name__ == "__main__":
              jp_orders, na_orders = fetch_fbm_orders()
              jp_file, jp_df = make_file(jp_orders, "JP")
              na_file, na_df = make_file(na_orders, "NA")
              send_telegram(jp_file, jp_df, na_file, na_df)
          PY
      - name: Run FBM Report
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          REFRESH_TOKEN_JP: ${{ secrets.REFRESH_TOKEN_JP }}
          REFRESH_TOKEN_NA: ${{ secrets.REFRESH_TOKEN_NA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report.py
